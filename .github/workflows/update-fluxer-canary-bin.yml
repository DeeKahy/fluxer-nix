name: Update fluxer-canary-bin

# Checks upstream's canary release metadata once a day. If a newer build is out,
# bumps package.nix, verifies the result actually builds, and opens a PR (or
# refreshes the one it opened earlier) with DeeKahy as reviewer.
#
# The bump itself is delegated to the package's own update.sh, so this workflow
# and `passthru.updateScript` cannot drift apart. In particular update.sh is
# what knows that there are two architectures to rehash.
#
# This only ever touches this repository.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: update-fluxer-canary-bin
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # api.fluxer.app/dl/... 302s to this; see the comment in package.nix.
  METADATA_URL: https://pkgs.fluxer.com/desktop/canary/linux/x64/latest.json
  PACKAGE: pkgs/by-name/fl/fluxer-canary-bin/package.nix
  UPDATE_SCRIPT: pkgs/by-name/fl/fluxer-canary-bin/update.sh
  BRANCH: auto/fluxer-canary-bin-update
  REVIEWER: DeeKahy

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check upstream for a newer canary build
        id: check
        run: |
          set -euo pipefail

          latest=$(curl -sSfL --retry 3 --retry-delay 5 "$METADATA_URL")
          new_version=$(jq -er '.version' <<<"$latest")
          pub_date=$(jq -r '.pub_date // "unknown"' <<<"$latest")

          old_version=$(sed -n 's/^  version = "\(.*\)";$/\1/p' "$PACKAGE")
          if [ -z "$old_version" ]; then
            echo "::error::Could not read the current version out of $PACKAGE"
            exit 1
          fi

          echo "current: $old_version"
          echo "upstream: $new_version (published $pub_date)"

          if [ "$new_version" = "$old_version" ]; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Date-based versions (YYYY.MDD.HHMMSS) do not compare correctly as
          # plain strings once the month rolls over to two digits, so use -V.
          if [ "$(printf '%s\n%s\n' "$old_version" "$new_version" | sort -V | tail -1)" != "$new_version" ]; then
            echo "::warning::Upstream is serving $new_version, older than the pinned $old_version. Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "changed=true"
            echo "old_version=$old_version"
            echo "new_version=$new_version"
            echo "pub_date=$pub_date"
          } >> "$GITHUB_OUTPUT"

      - name: Bump package.nix
        if: steps.check.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: |
          set -euo pipefail

          # update.sh rehashes every architecture and refuses to write a
          # half-updated file if upstream ever stops publishing them together.
          ./"$UPDATE_SCRIPT"

          grep -qF "version = \"$NEW_VERSION\";" "$PACKAGE"

          # Guard against the two architectures ending up with the same hash,
          # which is what a careless single-line sed here used to produce.
          hashes=$(sed -n 's/^      hash = "\(.*\)";$/\1/p' "$PACKAGE")
          if [ "$(printf '%s\n' "$hashes" | wc -l)" -ne "$(printf '%s\n' "$hashes" | sort -u | wc -l)" ]; then
            echo "::error::The per-architecture hashes in $PACKAGE are not distinct"
            exit 1
          fi

          git --no-pager diff -- "$PACKAGE"

      - name: Build it
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          nix build .#fluxer-canary-bin --print-build-logs

          # The build fetches the AppImage against the new hash and runs
          # extraInstallCommands, so a layout change upstream fails here rather
          # than landing in a PR. The desktop entry's basename and the icon name
          # both come from inside the AppImage, so check them by name.
          test -x result/bin/fluxer-canary-bin
          test -f result/share/applications/app.fluxer.FluxerDesktopCanary.desktop
          test -f result/share/icons/hicolor/48x48/apps/fluxer-canary.png

      - name: Collect the upstream changelog
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLD_VERSION: ${{ steps.check.outputs.old_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: |
          set -euo pipefail

          # Best effort: the script prints an explanatory block rather than
          # failing, but a crash here must not sink an otherwise good bump.
          python3 .github/scripts/changelog.py "$OLD_VERSION" "$NEW_VERSION" \
            > "$RUNNER_TEMP/changelog.md" \
            || echo "<!-- changelog generation failed -->" > "$RUNNER_TEMP/changelog.md"

          cat "$RUNNER_TEMP/changelog.md"

      - name: Push the branch
        if: steps.check.outputs.changed == 'true'
        env:
          OLD_VERSION: ${{ steps.check.outputs.old_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always rebuild the branch on top of the default branch so repeated
          # runs replace the bump instead of stacking commits on top of it.
          git checkout -B "$BRANCH"
          git add -- "$PACKAGE"
          git commit -m "fluxer-canary-bin: $OLD_VERSION -> $NEW_VERSION"
          git push --force origin "$BRANCH"

      - name: Open or refresh the PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_VERSION: ${{ steps.check.outputs.old_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          PUB_DATE: ${{ steps.check.outputs.pub_date }}
        run: |
          set -euo pipefail

          title="fluxer-canary-bin: $OLD_VERSION -> $NEW_VERSION"
          workflow_url="https://github.com/$GITHUB_REPOSITORY/blob/main/.github/workflows/update-fluxer-canary-bin.yml"
          body_file="$RUNNER_TEMP/pr-body.md"

          {
            printf '%s\n' \
              "Automated bump of the canary AppImage." \
              "" \
              "| | |" \
              "| --- | --- |" \
              "| From | \`$OLD_VERSION\` |" \
              "| To | \`$NEW_VERSION\` |" \
              "| Published upstream | $PUB_DATE |" \
              "" \
              "The hashes come from [upstream's release metadata]($METADATA_URL), via the" \
              "package's own \`update.sh\`, for both x86_64 and aarch64." \
              "\`nix build .#fluxer-canary-bin\` succeeded on this branch, and the wrapper," \
              "desktop entry and icons are all present in the result. Nobody has launched it," \
              "though. That part is on you, @$REVIEWER." \
              ""
            cat "$RUNNER_TEMP/changelog.md"
            printf '%s\n' \
              "" \
              "<sub>Opened by [\`update-fluxer-canary-bin.yml\`]($workflow_url). Re-run with \`gh workflow run update-fluxer-canary-bin.yml\`.</sub>"
          } > "$body_file"

          # Deliberately --state open: a closed PR must not be resurrected by
          # editing it, or a bump you rejected would keep getting new content
          # pushed into it and you would never see a fresh one.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Refreshing open PR #$existing"
            gh pr edit "$existing" --title "$title" --body-file "$body_file"

            # Only re-request a review once the previous request has been
            # cleared, so a PR left open for a week does not ping every morning.
            pending=$(gh pr view "$existing" --json reviewRequests --jq "[.reviewRequests[].login] | index(\"$REVIEWER\")")
            if [ "$pending" = "null" ]; then
              gh pr edit "$existing" --add-reviewer "$REVIEWER" \
                || echo "::warning::Could not request a review from $REVIEWER"
            fi
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body-file "$body_file" \
              --assignee "$REVIEWER"
            gh pr edit "$BRANCH" --add-reviewer "$REVIEWER" \
              || echo "::warning::Could not request a review from $REVIEWER"
          fi

          gh pr list --head "$BRANCH" --state open --json url --jq '"PR: " + .[0].url' \
            | tee -a "$GITHUB_STEP_SUMMARY"
